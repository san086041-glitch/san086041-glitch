<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="Firmwright: An event-driven desktop agent for embedded dev">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#f97316" stop-opacity=".14"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient>
    <clipPath id="cl"><rect x="1" y="1" width="598" height="298" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .name { font-size: 28px; font-weight: 700; fill: #1f2328; }
    .tagline { font-size: 16px; fill: #59636e; }
    .body { font-size: 16.5px; fill: #1f2328; opacity: .88; }
    .chip { font-size: 13px; fill: #59636e; }
    .foot { font-size: 13px; fill: #818b98; }
  </style>
  <g clip-path="url(#cl)">
    <rect width="600" height="300" fill="url(#bg)"/>
    <circle cx="560" cy="20" r="220" fill="url(#glow)"/>
  </g>
  <rect x=".5" y=".5" width="599" height="299" rx="18" fill="none" stroke="#d0d7de"/>
  <rect x="40" y="36" width="60" height="60" rx="14" fill="url(#ic)"/>
  <g transform="translate(70 66)"><rect x="-15" y="-15" width="30" height="30" rx="5" fill="none" stroke="#fff" stroke-width="2.4"/>
      <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#fff"/>
      <path d="M-8 -15v-6M0 -15v-6M8 -15v-6M-8 15v6M0 15v6M8 15v6M-15 -8h-6M-15 0h-6M-15 8h-6M15 -8h6M15 0h6M15 8h6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></g>
  <text x="118" y="64" class="sans name">Firmwright</text>
  <text x="118" y="88" class="sans tagline">An event-driven desktop agent for embedded dev</text>
  <text x="560" y="64" text-anchor="end" class="mono foot">v0.1.1 ↗</text>
  <text x="40" y="150" class="sans body">Builds, flashes, watches the serial port, decodes the crash</text><text x="40" y="175" class="sans body">and fixes the firmware: on a real ESP32 board, not in a chat</text><text x="40" y="200" class="sans body">window.</text>
  <rect x="40" y="232" width="68.4" height="28" rx="14" fill="#ffffff" stroke="#d0d7de"/><text x="74.2" y="251" text-anchor="middle" class="mono chip">Python</text><rect x="116.4" y="232" width="85.2" height="28" rx="14" fill="#ffffff" stroke="#d0d7de"/><text x="159.0" y="251" text-anchor="middle" class="mono chip">Electron</text><rect x="209.60000000000002" y="232" width="60.0" height="28" rx="14" fill="#ffffff" stroke="#d0d7de"/><text x="239.6" y="251" text-anchor="middle" class="mono chip">React</text><rect x="277.6" y="232" width="76.8" height="28" rx="14" fill="#ffffff" stroke="#d0d7de"/><text x="316.0" y="251" text-anchor="middle" class="mono chip">ESP-IDF</text><rect x="362.40000000000003" y="232" width="43.2" height="28" rx="14" fill="#ffffff" stroke="#d0d7de"/><text x="384.0" y="251" text-anchor="middle" class="mono chip">ACP</text>
</svg>
