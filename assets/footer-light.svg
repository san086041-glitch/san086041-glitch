<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="Thanks for stopping by.">
  <defs>
    <linearGradient id="wg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset=".5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <clipPath id="view"><rect width="1200" height="170"/></clipPath>
  </defs>
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 17px; fill: #59636e; }
  </style>
  <text x="600" y="30" text-anchor="middle" class="t">thanks for stopping by, the loop continues</text>
  <g clip-path="url(#view)">
  <mask id="m0" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="170">
    <path d="M0 170 H2400 V95 Q2250.0 81 2100.0 95 T1800.0 95 T1500.0 95 T1200.0 95 T900.0 95 T600.0 95 T300.0 95 T0.0 95 Z" fill="#fff">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="16s" repeatCount="indefinite"/>
    </path>
  </mask>
  <rect width="1200" height="170" fill="url(#wg)" fill-opacity="0.3" mask="url(#m0)"/>
  <mask id="m1" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="170">
    <path d="M0 170 H2400 V108 Q2100.0 94 1800.0 108 T1200.0 108 T600.0 108 T0.0 108 Z" fill="#fff">
      <animateTransform attributeName="transform" type="translate" from="-1200 0" to="0 0" dur="11s" repeatCount="indefinite"/>
    </path>
  </mask>
  <rect width="1200" height="170" fill="url(#wg)" fill-opacity="0.55" mask="url(#m1)"/>
  <mask id="m2" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="170">
    <path d="M0 170 H2400 V122 Q2300.0 112 2200.0 122 T2000.0 122 T1800.0 122 T1600.0 122 T1400.0 122 T1200.0 122 T1000.0 122 T800.0 122 T600.0 122 T400.0 122 T200.0 122 T0.0 122 Z" fill="#fff">
