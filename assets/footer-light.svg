<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="1200" height="90" role="img" aria-label="Thanks for stopping by.">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset=".5" stop-color="#7c3aed"/>
      <stop offset=".5" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 17px; fill: #59636e; }
    .caret { fill: #0891b2; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
  </style>
  <rect x="100" y="20" width="1000" height="1.5" fill="url(#line)"/>
  <text x="600" y="64" text-anchor="middle" class="mono">thanks for stopping by — the loop continues<tspan class="caret"> ▍</tspan></text>
</svg>
