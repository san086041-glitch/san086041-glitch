<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="FailGate: The acceptance layer for bug fixes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#22c55e" stop-opacity=".26"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
    <clipPath id="cl"><rect x="1" y="1" width="598" height="298" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .name { font-size: 28px; font-weight: 700; fill: #f0f6fc; }
    .tagline { font-size: 16px; fill: #9da7b3; }
    .body { font-size: 16.5px; fill: #f0f6fc; opacity: .88; }
    .chip { font-size: 13px; fill: #9da7b3; }
    .foot { font-size: 13px; fill: #6e7681; }
  </style>
  <g clip-path="url(#cl)">
    <rect width="600" height="300" fill="url(#bg)"/>
    <circle cx="560" cy="20" r="220" fill="url(#glow)"/>
  </g>
  <rect x=".5" y=".5" width="599" height="299" rx="18" fill="none" stroke="#30363d"/>
  <rect x="40" y="36" width="60" height="60" rx="14" fill="url(#ic)"/>
  <g transform="translate(70 66)"><path d="M0 -22 L18 -15 V0 C18 12 9 19 0 23 C-9 19 -18 12 -18 0 V-15 Z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M-8 0 L-2 6 L9 -6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="118" y="64" class="sans name">FailGate</text>
  <text x="118" y="88" class="sans tagline">The acceptance layer for bug fixes</text>
  <text x="560" y="64" text-anchor="end" class="mono foot">demo ↗</text>
  <text x="40" y="150" class="sans body">Seals a failing test for every bug before anyone touches the</text><text x="40" y="175" class="sans body">code, then grades every PR that claims to fix it, human or AI</text><text x="40" y="200" class="sans body">agent.</text>
  <rect x="40" y="232" width="68.4" height="28" rx="14" fill="#161b22" stroke="#30363d"/><text x="74.2" y="251" text-anchor="middle" class="mono chip">Python</text><rect x="116.4" y="232" width="93.6" height="28" rx="14" fill="#161b22" stroke="#30363d"/><text x="163.2" y="251" text-anchor="middle" class="mono chip">LangGraph</text><rect x="218.0" y="232" width="43.2" height="28" rx="14" fill="#161b22" stroke="#30363d"/><text x="239.6" y="251" text-anchor="middle" class="mono chip">MCP</text><rect x="269.2" y="232" width="68.4" height="28" rx="14" fill="#161b22" stroke="#30363d"/><text x="303.4" y="251" text-anchor="middle" class="mono chip">Docker</text><rect x="345.6" y="232" width="102.0" height="28" rx="14" fill="#161b22" stroke="#30363d"/><text x="396.6" y="251" text-anchor="middle" class="mono chip">GitHub App</text>
</svg>
