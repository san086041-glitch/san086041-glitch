<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Hi, I'm Jian. I build AI agents and love exploring how they work.">
  <title>Hi, I'm Jian. I build AI agents and love exploring how they work.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <radialGradient id="glow1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".16"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2"><stop offset="0" stop-color="#06b6d4" stop-opacity=".14"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <radialGradient id="core" cx=".35" cy=".3">
      <stop offset="0" stop-color="#0891b2"/><stop offset="1" stop-color="#7c3aed"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1f2328" fill-opacity=".06"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="398" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .hello { font-size: 62px; font-weight: 700; fill: #1f2328; letter-spacing: -1px; }
    .tag { font-size: 22px; fill: #59636e; }
    .status { font-size: 15px; fill: #59636e; }
    .label { font-size: 15px; fill: #818b98; }
    .phrase { font-size: 20px; fill: url(#accent); opacity: 0; animation: phrase 12s infinite; }
    .pill { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
    .nodelabel { font-size: 15px; fill: #59636e; }
    .node { animation: node 8s infinite; }
    .node .pill { animation: pill 8s infinite; animation-delay: inherit; }
    .orbit { fill: none; stroke: url(#accent); stroke-width: 1.5; stroke-dasharray: 3 9; stroke-opacity: .7; animation: flow 3s linear infinite; }
    .pulse { fill: none; stroke: #7c3aed; stroke-width: 2; animation: pulse 2.6s ease-out infinite; transform-origin: 935px 200px; }
    .live { animation: blink 1.6s ease-in-out infinite; }
    .caret { fill: #0891b2; animation: blink 1s steps(1) infinite; }
    @keyframes phrase { 0% { opacity: 0; } 4% { opacity: 1; } 30% { opacity: 1; } 34% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes pill { 0%, 16%, 100% { fill: #ffffff; stroke: #d0d7de; } 4%, 9% { fill: #f3edff; stroke: #7c3aed; } }
    @keyframes node { 0%, 16%, 100% { opacity: .85; } 4%, 9% { opacity: 1; } }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    @keyframes pulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(1.9); opacity: 0; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) {
      .phrase, .node, .node .pill, .orbit, .pulse, .live, .caret { animation: none; }
      .phrase:first-of-type { opacity: 1; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#dots)"/>
    <circle cx="980" cy="120" r="330" fill="url(#glow1)"/>
    <circle cx="160" cy="420" r="320" fill="url(#glow2)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="399" rx="20" fill="none" stroke="#d0d7de"/>

  <!-- status chip -->
  <rect x="72" y="70" width="252" height="34" rx="17" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="94" cy="87" r="5" fill="#1a7f37" class="live"/>
  <text x="108" y="92" class="mono status">agent.status = "curious"</text>

  <text x="68" y="182" class="sans hello">Hi, I'm <tspan fill="url(#accent)">Jian</tspan></text>
  <text x="72" y="228" class="sans tag">I build AI agents, and love exploring how they work.</text>

  <text x="72" y="284" class="mono label">// currently exploring</text>
    <text x="72" y="318" class="mono phrase" style="animation-delay:0s">how agents remember, plan and act</text>
    <text x="72" y="318" class="mono phrase" style="animation-delay:4s">what they do when the world pushes back</text>
    <text x="72" y="318" class="mono phrase" style="animation-delay:8s">how we know an agent got it right</text>

  <!-- agent loop -->
  <circle cx="935" cy="200" r="118" class="orbit"/>
  <circle cx="935" cy="200" r="40" class="pulse"/>
  <circle cx="935" cy="200" r="40" fill="url(#core)"/>
  <text x="935" y="206" text-anchor="middle" class="mono" font-size="16" font-weight="700" fill="#ffffff">agent</text>
  <g>
    <circle r="11" fill="#0891b2" fill-opacity=".55" filter="url(#soft)"/>
    <circle r="5.5" fill="#0891b2"/>
    <animateMotion dur="8s" repeatCount="indefinite" path="M 935 82 A 118 118 0 1 1 934.99 82"/>
  </g>
    <g class="node" style="animation-delay:-0.25s">
      <rect x="887.2" y="65" width="95.5" height="34" rx="17" class="pill"/>
      <text x="935" y="88" text-anchor="middle" class="mono nodelabel">observe</text>
    </g>
    <g class="node" style="animation-delay:1.75s">
      <rect x="1021.0" y="183" width="64.0" height="34" rx="17" class="pill"/>
      <text x="1053" y="206" text-anchor="middle" class="mono nodelabel">plan</text>
    </g>
    <g class="node" style="animation-delay:3.75s">
      <rect x="908.2" y="301" width="53.5" height="34" rx="17" class="pill"/>
      <text x="935" y="324" text-anchor="middle" class="mono nodelabel">act</text>
    </g>
    <g class="node" style="animation-delay:5.75s">
      <rect x="774.5" y="183" width="85.0" height="34" rx="17" class="pill"/>
      <text x="817" y="206" text-anchor="middle" class="mono nodelabel">verify</text>
    </g>
</svg>
